# file_size_ratchet.conf
#
# Structural anti-drift baselines for the GUI wallet (greenfield composition
# discipline). Consumed by scripts/ci/check_file_size_ratchet.sh.
# Policy: .cursor/rules/27-composition-decomposition.mdc
# Template: shekyl-core scripts/ci/engine_decomposition_ratchet.conf
#
# The check FAILS in BOTH directions, exactly like shekyl-core's engine
# decomposition ratchet:
#   - regression: a measured value EXCEEDS its ceiling, or a non-baselined
#     file crosses NEW_FILE_CAP  -> a god-file is re-forming.
#   - slack: a FILE dropped more than BAND below its ceiling without the
#     baseline being tightened -> a win was made but not locked in; lower
#     the number here so it can never grow back.
#
# Raising any ceiling is therefore a visible, reviewable diff in THIS file —
# that diff is the "demotion requires an explicit decision" gate. Nothing
# grows silently; every relaxation is a line a reviewer must approve.
#
# Roots scanned (relative to repo root):
#   - src-tauri/src/**/*.rs
#   - src/**/*.{ts,tsx}   (tests under __tests__/ and *.test.* are EXCLUDE'd)

# --- Any non-baselined production file must stay at/under this ------------
# 1000 matches the review / composition rule: do not push a module past 1k
# without extracting first. Pre-existing oversize modules are baselined
# below at their measured sizes and can only shrink.
NEW_FILE_CAP     1000

# --- Slack band (lines) for FILE ceilings before "tighten the baseline" ---
BAND             50

# --- Per-file ceilings: currently over NEW_FILE_CAP; can only decrease -----
# Keys are repo-relative paths (not bare basenames) so nested files are
# unambiguous.
#
# commands.rs: Tauri command surface. Baseline at post-GUI-PR3b size after
# collapsing drain/staking identity DTO hops. Ratchet DOWN when wallet
# command groups split into feature modules (shard_visual already shows
# the pattern). Raising requires an explicit-decision note in the PR.
# 2026-08-23: 1226 -> 1128. The daemon-connection group (where the wallet
# points, what pointing there discloses, and the node's health) moved to
# `daemon_connection.rs` when the RT-W7 disclosure surface pushed this file
# back over the ceiling — the split the note above asks for, taken instead
# of the raise.
FILE   src-tauri/src/commands.rs            1128

# --- Test / fixture scaffolding: not the monolith concern ---------------
# Growing a test harness is not re-forming a god-object. Kept explicit
# (not glob-guessed) so the exclusion set is itself reviewable.
EXCLUDE   src/pages/__tests__
EXCLUDE   src/components/__tests__
EXCLUDE   src/lib/__tests__
EXCLUDE   src/test
