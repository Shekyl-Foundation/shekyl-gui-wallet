# Command-surface dispositions — read by scripts/ci/check_command_surface.sh.
#
# Every Tauri command registered in the default build is one of:
#
#   (no row)   its name is a SPECIFIED method of the wallet contract
#              (shekyl-core docs/api/wallet_rpc.yaml x-shekyl-method-registry):
#              a contract adapter. Nothing to declare.
#   SHELL      a GUI-only concern with no contract analogue — the app shell
#              around the wallet (daemon sidecar, window, clipboard, wallet
#              directory, feature flags). The reason is the rest of the line.
#   RENAME     the same operation as one contract method under a GUI-only
#              name. The detail is that method. These rows are the vocabulary
#              drift ledger: slice (d) retires them by renaming, and the gate
#              refuses a row whose target is not SPECIFIED.
#   COMPOSITE  a GUI-shaped read projected from one or more contract methods
#              in one round trip — not the same operation as any one of them.
#              The detail lists those methods. The gate checks each is
#              SPECIFIED; it does not parse the function, so the row is a
#              reviewed claim (rule 27), not a call graph.
#
# A row for a name that is not registered in the default build is stale and
# fails the gate. A registered name with neither a contract match nor a row
# fails the gate. A name the contract REJECTED must never be registered.
#
# Format: <command> <SHELL|RENAME|COMPOSITE> <detail...>

# ── Staking reads ───────────────────────────────────────────────────────────
# Two different reads. get_staker_status copies the local ledger hint
# (ledger().staking, bonded slots included). get_staking_view is the contract
# projection: StakeFacade::staking_read_view, the shared source of the three
# methods on its row (engine_session::staking_view).
get_staker_status        SHELL      local ledger hint for the staking page (bonded slots)
get_staking_view         COMPOSITE  staking_info get_staked_balance get_staked_outputs

# ── App shell: the daemon sidecar and its connection ────────────────────────
daemon_status                 SHELL  sidecar process state — the RPC server has no daemon to spawn
get_daemon_settings           SHELL  sidecar launch settings (gui-config.json)
set_daemon_settings           SHELL  sidecar launch settings (gui-config.json)
get_chain_health              SHELL  daemon chain health for the status bar (daemon RPC, not wallet RPC)
get_wallet_status             SHELL  status bar: daemon get_info, plus whether a wallet is open
set_daemon_connection         SHELL  which daemon this app talks to; persisted per install
daemon_connection_disclosures SHELL  warnings the UI must show for a remote daemon (rule 82)

# ── App shell: status panels ────────────────────────────────────────────────
get_pqc_status      SHELL  build-time PQC posture for the security panel
get_security_status SHELL  runtime security posture for the security panel
get_feature_flags   SHELL  which cargo features this binary was built with (multisig gate)

# ── App shell: clipboard (Rust owns the seed's clipboard lifetime) ──────────
copy_to_clipboard SHELL  hash-checked timed clear; GUI_SECURITY.md "Recovery phrase"
clear_clipboard   SHELL  hash-checked timed clear; GUI_SECURITY.md "Recovery phrase"

# ── App shell: mining (the sidecar's miner, not a wallet operation) ─────────
get_mining_status SHELL  sidecar miner state
start_mining_cmd  SHELL  sidecar miner control
stop_mining_cmd   SHELL  sidecar miner control

# ── App shell: wallet directory and startup ─────────────────────────────────
check_wallet_files SHELL  lists wallet files in the configured directory (Welcome screen)
ensure_wallet_dir  SHELL  startup: ensures the configured wallet directory exists before create/open
set_wallet_dir     SHELL  user-chosen wallet directory, persisted (gui-config.json)
reset_wallet_dir   SHELL  back to the platform default directory
get_wallet_dir     SHELL  the directory in effect, for display

# ── App shell: shard preview and coverage (daemon RPC, not wallet RPC) ──────
list_shard_preview_fixtures SHELL  pre-archival beta fixtures (SHARD_PREVIEW_CUTOVER.md)
render_shard_preview        SHELL  pre-archival beta render (SHARD_PREVIEW_CUTOVER.md)
list_shards                 SHELL  daemon get_archival_shard_coverage projection
get_shard_render            SHELL  daemon request_archival_shard, lazy render
