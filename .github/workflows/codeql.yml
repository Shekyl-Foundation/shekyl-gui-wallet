name: "CodeQL Analysis"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "30 5 * * 1"   # Every Monday at 5:30 AM UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-rust:
    name: Analyze Rust (Tauri backend + PQC)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout Shekyl core (path dependency for Rust crates)
        run: |
          set -euo pipefail
          REF="${{ github.head_ref || github.ref_name }}"
          case "$REF" in
            main|dev) CORE_BRANCH=dev ;;
            *)
              if git ls-remote --heads https://github.com/Shekyl-Foundation/shekyl-core.git "$REF" | grep -q .; then
                CORE_BRANCH="$REF"
              else
                CORE_BRANCH=dev
              fi
              ;;
          esac
          echo "Checking out shekyl-core branch: $CORE_BRANCH"
          git clone --depth 1 --branch "$CORE_BRANCH" --recurse-submodules --shallow-submodules \
            https://github.com/Shekyl-Foundation/shekyl-core.git ../shekyl-core

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tauri resolves `externalBin` before compiling anything and fails if
      # the sidecar path is absent, so even a job that never runs the daemon
      # needs a file at its name. Empty is enough: nothing executes it.
      - name: Create sidecar placeholder for Tauri build script
        run: |
          set -euo pipefail
          # Tauri names the sidecar by target triple (see
          # src-tauri/binaries/README.md). Read it from the toolchain rather
          # than hard-coding one, so the step is correct on whatever runner
          # this job lands on.
          triple=$(rustc -vV | sed -n 's/^host: //p')
          [ -n "$triple" ] || { echo "no 'host:' line in 'rustc -vV'" >&2; exit 1; }
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/shekyld-$triple"

      - name: Initialize CodeQL for Rust
        uses: github/codeql-action/init@v4
        with:
          languages: rust

      - name: Build Rust (Tauri backend)
        run: |
          cd src-tauri
          cargo check --release

      - name: Perform CodeQL Analysis (Rust)
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"

  analyze-typescript:
    name: Analyze TypeScript / JavaScript (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL for TypeScript
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis (Frontend)
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"