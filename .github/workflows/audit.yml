name: Dependency Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (high/critical)
        run: npm audit --audit-level=high

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      # The audit job only compiles the `cargo-audit` tool and reads
      # `Cargo.lock`; it does not build the project, so it tracks the latest
      # stable toolchain rather than the project MSRV pin. (Pinning to 1.94.0
      # broke here once cargo-audit's deps required rustc 1.96.)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

      # audit.toml denies "unsound" advisories and ignores RUSTSEC-2024-0429
      # (glib 0.18's VariantStrIter, held by Tauri's GTK3 stack). The ignore
      # is checked so it can fail: no package but glib, and nothing in
      # src-tauri/src, may name the symbols that reach the bug, and every
      # "unsound" ignore needs a row in the script's table. It classifies the
      # ignores from the advisory database `cargo audit` fetched just above
      # (~/.cargo/advisory-db), so it runs after it. Selftest first, so a
      # check that cannot bite does not pass (rule 47).
      - name: Ignored unsound advisories stay unreached
        run: |
          python3 ../scripts/ci/check_unreached_advisories.py --selftest
          python3 ../scripts/ci/check_unreached_advisories.py
