name: Release

# A tag push builds and publishes. A manual dispatch is the dry run: it
# builds every platform from the same steps, keeps the bundles as run
# artifacts, and creates or uploads to no release. Dispatch it on the
# release branch before the wallet tag exists, naming a shekyl-core gitian
# run dispatched with `package_dry_run`.
#
# The installers carry core's gitian-built `shekyld` and its pinned Tor,
# never a rebuild on the runner (GUI_SYNC_LANE.md GS-Q5, GS-1). A tag build
# takes the archives from core's release at SHEKYL_CORE_REF, signed by the
# Foundation; a dry run takes them from the named gitian run, and compiles
# the Engine crates against the commit that run built.
on:
  workflow_dispatch:
    inputs:
      core_gitian_run:
        description: "shekyl-core gitian run id (a run with package_dry_run) whose archives the dry run takes"
        type: string
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Matching-tag pin. Bump this when pairing the next GUI tag with a new
  # shekyl-core tag. CI (`ci.yml`, `codeql.yml`) stays on core `dev`.
  SHEKYL_CORE_REF: v3.1.0-alpha.11

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE=""
          case "$TAG" in *beta*|*alpha*|*rc*) PRERELEASE="--prerelease" ;; esac

          gh release create "$TAG" \
            --title "Shekyl Wallet $TAG" \
            --notes "See the assets below to download and install Shekyl Wallet for your platform.

          **Linux**: The \`.deb\` is universal (all dependencies statically linked). The \`.AppImage\` also works on any distro.

          Refer to the [installation guide](https://github.com/Shekyl-Foundation/shekyl-gui-wallet/blob/main/docs/INSTALLATION.md) for detailed instructions." \
            $PRERELEASE \
            --verify-tag || true

  # Fetch core's archive for every installer and check its digest, once,
  # on Linux: a tag build verifies `SHA256SUMS.asc` under the Foundation
  # signing subkey, a dry run checks each artifact against the digest
  # GitHub recorded. The build jobs take the checked archives from this
  # run, and the Engine crates compile against `commit`.
  core-archives:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v7

      # A tag build verifies core's signed manifest, so it reads the
      # Foundation's public key from the tag's SIGNING.md; the subkey it must
      # verify under is pinned in core_archive.py.
      - name: Checkout Shekyl core at the paired tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir ../shekyl-core
          git -C ../shekyl-core init --quiet
          git -C ../shekyl-core remote add origin https://github.com/Shekyl-Foundation/shekyl-core.git
          git -C ../shekyl-core fetch --depth 1 --quiet origin "refs/tags/$SHEKYL_CORE_REF"
          git -C ../shekyl-core checkout --quiet FETCH_HEAD

      - name: Fetch and check core's archives
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ inputs.core_gitian_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            source=(--release "$SHEKYL_CORE_REF" --core ../shekyl-core)
          else
            source=(--run "$RUN_ID")
          fi
          python3 scripts/release/core_archive.py fetch "${source[@]}" \
            --host x86_64-linux-gnu \
            --host x86_64-w64-mingw32 \
            --host aarch64-apple-darwin11 \
            --out core-archives

      # The commit the Engine crates compile against: the tag's, or for a
      # dry run the commit its archives were built from (their shared
      # suffix, gitian's tag input, resolved in core and matched to what the
      # Linux daemon reports). Never the run's head_sha: a dispatch on one
      # commit can build another.
      - name: The core commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            commit="$(git -C ../shekyl-core rev-parse HEAD)"
          else
            commit="$(python3 scripts/release/core_archive.py archive-commit --archives core-archives)"
          fi
          echo "core archives built from shekyl-core $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: core-archives
          path: core-archives/
          if-no-files-found: error

  build:
    needs: [create-release, core-archives]
    # create-release is skipped on a dry run; build anyway, unless it failed.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' && needs.core-archives.result == 'success' }}
    name: Build (${{ matrix.platform }}${{ matrix.tauri_target && format(' {0}', matrix.tauri_target) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ""
            gitian_host: x86_64-linux-gnu
            tauri_triple: x86_64-unknown-linux-gnu
          - platform: windows-2025-vs2026
            args: ""
            gitian_host: x86_64-w64-mingw32
            tauri_triple: x86_64-pc-windows-msvc
          - platform: macos-latest
            tauri_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            gitian_host: aarch64-apple-darwin11
            tauri_triple: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    env:
      # One artifact name per matrix row. `platform` alone collides if a
      # second row shares the runner image, which a second macOS target
      # would. `tauri_target` is unset on Linux and Windows, so those names
      # stay `dry-run-<platform>`.
      DRY_RUN_ARTIFACT: dry-run-${{ matrix.platform }}${{ matrix.tauri_target && format('-{0}', matrix.tauri_target) || '' }}
      # The release-only Tauri config: `tor/` and `tor-licenses/` as their
      # own resource directories (TB-7: nothing else in `tor/`).
      RELEASE_CONFIG: src-tauri/tauri.release.conf.json
    steps:
      - uses: actions/checkout@v7

      # shekyl-core satisfies the Tauri crate's path-deps on
      # `../../shekyl-core/rust/*` and provides `tor_bundle.py` and the Tor
      # pins. It is the commit core-archives resolved, so the Engine crates
      # compile against the tree that built the archive.
      - name: Checkout Shekyl core (Engine crates, Tor pins)
        shell: bash
        env:
          CORE_COMMIT: ${{ needs.core-archives.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir ../shekyl-core
          git -C ../shekyl-core init --quiet
          git -C ../shekyl-core remote add origin https://github.com/Shekyl-Foundation/shekyl-core.git
          git -C ../shekyl-core fetch --depth 1 --quiet origin "$CORE_COMMIT"
          git -C ../shekyl-core checkout --quiet FETCH_HEAD
          git -C ../shekyl-core submodule update --init --recursive --depth 1 --quiet
          echo "shekyl-core at $(git -C ../shekyl-core rev-parse HEAD)"

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
          targets: ${{ startsWith(matrix.platform, 'macos') && matrix.tauri_target || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Tauri system deps (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libarchive-tools squashfs-tools

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v7
        with:
          name: core-archives
          path: core-archives

      # The sidecar, tor/ and tor-licenses/ from the checked archive, then
      # the staged tor/ against the pins of the same core commit. A macOS
      # row ships the Foundation's signed files, and verify ties them to
      # Tor's tarball, so the sources cache is fetched first.
      - name: Place core's daemon and Tor
        shell: bash
        env:
          HOST: ${{ matrix.gitian_host }}
          TRIPLE: ${{ matrix.tauri_triple }}
        run: |
          set -euo pipefail
          python scripts/release/core_archive.py place \
            --archives core-archives --host "$HOST" --tauri-triple "$TRIPLE" \
            --binaries src-tauri/binaries
          python ../shekyl-core/scripts/release/tor_bundle.py fetch --host "$HOST" --sources "$RUNNER_TEMP/tor-sources"
          python ../shekyl-core/scripts/release/tor_bundle.py verify --host "$HOST" \
            --dir src-tauri/binaries/tor --sources "$RUNNER_TEMP/tor-sources"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # ── Linux: build Tauri and upload artifacts manually ──

      # The .deb and .rpm carry Tor as resources, copied as they are. The
      # AppImage cannot: Tauri's AppImage step runs linuxdeploy over every
      # ELF file in the AppDir, and it re-paths Tor's, which the pin then
      # refuses. So the AppImage is built without Tor, and core_archive.py
      # puts the placed tor/ into its squashfs afterwards, under the same
      # resource directory the .deb uses.
      - name: Build Tauri app (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          set -euo pipefail
          npx tauri build --bundles deb,rpm --config "$RELEASE_CONFIG"
          npx tauri build --bundles appimage
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ] || [ ! -f "${appimages[0]}" ]; then
            echo "::error::expected one AppImage, found ${appimages[*]}"
            exit 1
          fi
          python scripts/release/core_archive.py appimage-add-tor \
            --appimage "${appimages[0]}" --binaries src-tauri/binaries \
            --tauri-conf src-tauri/tauri.conf.json

      # Backend integration tests that need a live `shekyld` sidecar are
      # marked `#[ignore]`, so the fast CI job (ci.yml) skips them. They run
      # here on the release build, where core's sidecar was placed above and
      # the frontend dist already exists
      # (from the tauri build), so the Tauri build script resolves.
      # `--lib --bins --tests` is required: a bare `cargo test -- --ignored`
      # also compiles rustdoc ` ```ignore ` examples (rustdoc treats
      # `--ignored` as "run ignored doctests"), which is how alpha.8's
      # Linux job died after the .deb had already been built.
      # Unit tests already ran on CI. Linux-only: daemon-interaction logic
      # is platform-agnostic, so one canonical run suffices. The live tests
      # (`src-tauri/src/live_daemon_tests.rs`) start the placed sidecar the
      # way the wallet does and read it through the wallet's own calls, so
      # a GUI paired with a core whose wire it does not speak fails here.
      # One at a time: each test starts its own node, and nodes starting
      # together on a loaded host have missed their 60 s startup read.
      - name: Backend integration tests (sidecar, Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        working-directory: src-tauri
        run: cargo test --release --lib --bins --tests -- --ignored --test-threads=1

      # Both runs fail here if a bundle is missing; only a tag push uploads.
      - name: Locate Linux bundles
        if: startsWith(matrix.platform, 'ubuntu')
        id: linux-bundles
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb artifact found after tauri build"
            exit 1
          fi
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No .AppImage artifact found after tauri build"
            exit 1
          fi
          RPM=$(find src-tauri/target/release/bundle/rpm -name '*.rpm' | head -1)
          if [ -z "$RPM" ]; then
            echo "::error::No .rpm artifact found after tauri build"
            exit 1
          fi
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "rpm=$RPM" >> "$GITHUB_OUTPUT"

      # The bundle is what ships, so its Tor is checked where the bundle put
      # it: exactly the pinned files (TB-7), executable, and pinned by the
      # bundled daemon (`--config-verify` reads the pin without starting
      # Tor). Tauri dropping an exec bit, adding a file to tor/ or leaving
      # the release config out all fail here.
      - name: Check the bundled daemon and Tor (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          HOST: ${{ matrix.gitian_host }}
          DEB: ${{ steps.linux-bundles.outputs.deb }}
          APPIMAGE: ${{ steps.linux-bundles.outputs.appimage }}
          RPM: ${{ steps.linux-bundles.outputs.rpm }}
        run: |
          set -euo pipefail
          check() {
            local root="$1" label="$2"
            mapfile -t tors < <(find "$root" -type d -name tor -path '*/lib/*')
            mapfile -t daemons < <(find "$root" -type f -name shekyld -path '*/bin/*')
            if [ "${#tors[@]}" -ne 1 ] || [ "${#daemons[@]}" -ne 1 ]; then
              echo "::error::$label holds ${#tors[@]} tor/ directories and ${#daemons[@]} shekyld; one of each is required"
              exit 1
            fi
            echo "$label: ${daemons[0]} with ${tors[0]}"
            python ../shekyl-core/scripts/release/tor_bundle.py verify --host "$HOST" \
              --dir "${tors[0]}" --sources "$RUNNER_TEMP/tor-sources"
            python scripts/release/core_archive.py check-installed \
              --shekyld "${daemons[0]}" --tor-file "${tors[0]}/tor"
          }
          deb="$RUNNER_TEMP/deb"
          dpkg-deb -x "$DEB" "$deb" || { echo "::error::cannot unpack $DEB"; exit 1; }
          check "$deb" .deb
          rpm="$RUNNER_TEMP/rpm"; mkdir "$rpm"
          bsdtar -xf "$RPM" -C "$rpm" || { echo "::error::cannot unpack $RPM"; exit 1; }
          check "$rpm" .rpm
          # Unpacked from its squashfs, never run: running an AppImage starts
          # the app.
          app="$RUNNER_TEMP/appimage"
          python scripts/release/core_archive.py appimage-unpack --appimage "$APPIMAGE" --dest "$app" \
            || { echo "::error::cannot unpack $APPIMAGE"; exit 1; }
          check "$app" .AppImage

      - name: Upload Linux bundles to release
        if: startsWith(matrix.platform, 'ubuntu') && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEB: ${{ steps.linux-bundles.outputs.deb }}
          APPIMAGE: ${{ steps.linux-bundles.outputs.appimage }}
          RPM: ${{ steps.linux-bundles.outputs.rpm }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" "$DEB" --clobber
          gh release upload "$TAG" "$APPIMAGE" --clobber
          gh release upload "$TAG" "$RPM" --clobber

      - name: Keep Linux bundles (dry run)
        if: startsWith(matrix.platform, 'ubuntu') && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DRY_RUN_ARTIFACT }}
          path: |
            ${{ steps.linux-bundles.outputs.deb }}
            ${{ steps.linux-bundles.outputs.appimage }}
            ${{ steps.linux-bundles.outputs.rpm }}
          if-no-files-found: error

      # ── macOS / Windows: build, check, then upload what was checked ──

      # With no releaseId, tagName or releaseName, tauri-action only builds.
      # A tag build uploads after the checks below, so an installer whose
      # Tor the checks refuse is never published.
      - name: Build (macOS / Windows)
        if: ${{ !startsWith(matrix.platform, 'ubuntu') }}
        id: tauri-build
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }} --config ${{ env.RELEASE_CONFIG }}

      - name: Check the bundled daemon and Tor (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          HOST: ${{ matrix.gitian_host }}
          TARGET: ${{ matrix.tauri_target }}
        run: |
          set -euo pipefail
          dmgs=(src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] && [ -f "${dmgs[0]}" ] || { echo "::error::expected one .dmg, found ${dmgs[*]}"; exit 1; }
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "${dmgs[0]}"
          trap 'hdiutil detach "$mnt"' EXIT
          app=("$mnt"/*.app)
          [ "${#app[@]}" -eq 1 ] && [ -d "${app[0]}" ] || { echo "::error::expected one .app in the .dmg"; exit 1; }
          python ../shekyl-core/scripts/release/tor_bundle.py verify --host "$HOST" \
            --dir "${app[0]}/Contents/Resources/tor" --sources "$RUNNER_TEMP/tor-sources"
          python scripts/release/core_archive.py check-installed \
            --shekyld "${app[0]}/Contents/MacOS/shekyld" \
            --tor-file "${app[0]}/Contents/Resources/tor/tor"

      # The NSIS installer is installed for the current user into a scratch
      # directory, and the installed tree is checked.
      - name: Check the installed daemon and Tor (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        env:
          HOST: ${{ matrix.gitian_host }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw "expected one NSIS setup, found $($setup.Count)" }
          $dir = Join-Path $env:RUNNER_TEMP 'shekyl-wallet-installed'
          $p = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }
          python ../shekyl-core/scripts/release/tor_bundle.py verify --host $env:HOST `
            --dir "$dir\tor" --sources "$env:RUNNER_TEMP\tor-sources"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/core_archive.py check-installed `
            --shekyld "$dir\shekyld.exe" --tor-file "$dir\tor\tor.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The checked bundles, under the names the release has always carried:
      # GitHub turns the spaces in Tauri's file names into dots. The .app goes
      # up as a tarball named after its .dmg, as tauri-action uploaded it.
      - name: Upload macOS / Windows bundles to release
        if: ${{ !startsWith(matrix.platform, 'ubuntu') && github.event_name == 'push' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mapfile -t paths < <(jq -r '.[]' <<<"$ARTIFACT_PATHS")
          uploads=()
          for path in "${paths[@]}"; do
            case "$path" in
              *-setup.exe|*.dmg) uploads+=("$path") ;;
              *.app)
                dmgs=("$(dirname "$path")"/../dmg/*.dmg)
                [ "${#dmgs[@]}" -eq 1 ] && [ -f "${dmgs[0]}" ] || { echo "::error::no one .dmg to name the .app after"; exit 1; }
                tarball="$(dirname "$path")/$(basename "${dmgs[0]}" .dmg).app.tar.gz"
                tar -czf "$tarball" -C "$(dirname "$path")" "$(basename "$path")"
                uploads+=("$tarball") ;;
            esac
          done
          [ "${#uploads[@]}" -gt 0 ] || { echo "::error::nothing to upload from $ARTIFACT_PATHS"; exit 1; }
          for f in "${uploads[@]}"; do gh release upload "$TAG" "$f" --clobber; done

      # artifactPaths is a JSON array; upload-artifact takes one path per line.
      - name: List macOS / Windows bundles (dry run)
        if: ${{ !startsWith(matrix.platform, 'ubuntu') && github.event_name != 'push' }}
        id: tauri-bundles
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
        run: |
          {
            echo 'paths<<BUNDLES'
            jq -r '.[]' <<<"$ARTIFACT_PATHS"
            echo 'BUNDLES'
          } >> "$GITHUB_OUTPUT"

      - name: Keep macOS / Windows bundles (dry run)
        if: ${{ !startsWith(matrix.platform, 'ubuntu') && github.event_name != 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DRY_RUN_ARTIFACT }}
          path: ${{ steps.tauri-bundles.outputs.paths }}
          if-no-files-found: error
