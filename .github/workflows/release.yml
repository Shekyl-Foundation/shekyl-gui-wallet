name: Release

# A tag push builds and publishes. A manual dispatch is the dry run: it
# builds every platform from the same steps, keeps the bundles as run
# artifacts, and creates or uploads to no release. Dispatch it on the
# release branch before the wallet tag exists, the way shekyl-core's
# gitian workflow is dispatched with `package_dry_run`.
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "shekyl-core ref to build the sidecar from (a branch, tag, or SHA); empty means SHEKYL_CORE_REF"
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Matching-tag pin. Bump this when pairing the next GUI tag with a new
  # shekyl-core tag. CI (`ci.yml`, `codeql.yml`) stays on core `dev`.
  SHEKYL_CORE_REF: v3.1.0-alpha.11

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE=""
          case "$TAG" in *beta*|*alpha*|*rc*) PRERELEASE="--prerelease" ;; esac

          gh release create "$TAG" \
            --title "Shekyl Wallet $TAG" \
            --notes "See the assets below to download and install Shekyl Wallet for your platform.

          **Linux**: The \`.deb\` is universal (all dependencies statically linked). The \`.AppImage\` also works on any distro.

          Refer to the [installation guide](https://github.com/Shekyl-Foundation/shekyl-gui-wallet/blob/main/docs/INSTALLATION.md) for detailed instructions." \
            $PRERELEASE \
            --verify-tag || true

          RELEASE_ID=$(gh release view "$TAG" --json databaseId -q .databaseId)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # create-release is skipped on a dry run; build anyway, unless it failed.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    name: Build (${{ matrix.platform }}${{ matrix.tauri_target && format(' {0}', matrix.tauri_target) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-2025-vs2026
            args: ""
          - platform: macos-latest
            tauri_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    env:
      # One artifact name per matrix row. `platform` alone collides if a
      # second row shares the runner image, which a second macOS target
      # would. `tauri_target` is unset on Linux and Windows, so those names
      # stay `dry-run-<platform>`.
      DRY_RUN_ARTIFACT: dry-run-${{ matrix.platform }}${{ matrix.tauri_target && format('-{0}', matrix.tauri_target) || '' }}
    steps:
      - uses: actions/checkout@v7

      # shekyl-core is cloned to (1) build the `shekyld` sidecar and (2)
      # satisfy the Tauri crate's path-deps on `../../shekyl-core/rust/*`.
      # Pin is the matching shekyl-core tag, not `dev`: replaying this
      # wallet tag must rebuild the same daemon and the same Engine crates.
      # Fetched by ref rather than `clone --branch`, which takes only a
      # branch or tag name: a dry run may name a commit SHA (the core
      # release commit before its tag exists). A tag push has no inputs,
      # so it always builds from SHEKYL_CORE_REF.
      - name: Checkout Shekyl core (daemon sidecar + Engine crates)
        # bash on every platform, Windows included: the step is written once.
        shell: bash
        env:
          CORE_REF: ${{ inputs.core_ref || env.SHEKYL_CORE_REF }}
        run: |
          if [ -z "${CORE_REF}" ]; then
            echo "::error::core_ref is empty; set the workflow input core_ref or SHEKYL_CORE_REF"
            exit 1
          fi
          echo "Building the sidecar from shekyl-core@${CORE_REF}"
          mkdir ../shekyl-core
          git -C ../shekyl-core init --quiet
          git -C ../shekyl-core remote add origin https://github.com/Shekyl-Foundation/shekyl-core.git
          git -C ../shekyl-core fetch --depth 1 --quiet origin "$CORE_REF"
          git -C ../shekyl-core checkout --quiet FETCH_HEAD
          git -C ../shekyl-core submodule update --init --recursive --depth 1 --quiet
          echo "shekyl-core at $(git -C ../shekyl-core rev-parse HEAD)"

      # Install the pinned toolchain *before* any cmake -j / make depends.
      # shekyl-core's rust/rust-toolchain.toml is channel-only for this
      # reason: parallel Cargo invocations race rustup's
      # ~/.rustup/downloads/ ("could not rename ...partial") if 1.94.0 is
      # not already present. Core CI installs it up front; this job must
      # too. `@stable` is the wrong channel — src-tauri/rust-toolchain.toml
      # and core both pin 1.94.0. Components match the GUI toml so the
      # later Tauri cargo does not auto-install rustfmt/clippy.
      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
          targets: ${{ startsWith(matrix.platform, 'macos') && matrix.tauri_target || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # ── Linux: use contrib/depends for all third-party libs ──

      - name: Install Linux build tools and Tauri system deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool cmake autotools-dev automake \
            pkg-config ccache python3 gperf bsdmainutils curl bzip2 \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev libharfbuzz-dev libudev-dev

      - name: Compute depends cache key
        if: startsWith(matrix.platform, 'ubuntu')
        id: depends-key
        run: echo "hash=$(cat ../shekyl-core/contrib/depends/packages/*.mk | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache depends prefix
        if: startsWith(matrix.platform, 'ubuntu')
        uses: actions/cache@v6
        id: depends-cache
        with:
          path: ${{ github.workspace }}/../shekyl-core/contrib/depends/built
          key: depends-x86_64-linux-gnu-${{ steps.depends-key.outputs.hash }}
          restore-keys: |
            depends-x86_64-linux-gnu-

      - name: Build shekyl-core with depends (all deps from source, static)
        if: startsWith(matrix.platform, 'ubuntu')
        working-directory: ../shekyl-core
        run: make depends target=x86_64-unknown-linux-gnu -j$(nproc)

      - name: Place sidecar binary (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          mkdir -p src-tauri/binaries
          cp ../shekyl-core/build/x86_64-unknown-linux-gnu/release/bin/shekyld \
             src-tauri/binaries/shekyld-x86_64-unknown-linux-gnu

      # ── macOS: Homebrew for now (depends cross-build is stretch goal) ──

      - name: Install macOS build dependencies
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install --quiet cmake boost hidapi openssl libpgm \
            miniupnpc expat protobuf abseil ccache libsodium unbound

      - name: Build Shekyl daemon sidecar (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          OPENSSL_ROOT_DIR: ${{ runner.temp }}/_brew_openssl
        run: |
          ln -sf "$(brew --prefix openssl@3)" "$OPENSSL_ROOT_DIR"
          cmake -S ../shekyl-core -B ../shekyl-core/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"
          cmake --build ../shekyl-core/build --target daemon -- -j$(sysctl -n hw.logicalcpu)

      - name: Place sidecar binary (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p src-tauri/binaries
          cp ../shekyl-core/build/bin/shekyld \
             src-tauri/binaries/shekyld-aarch64-apple-darwin

      # ── Common: Node, frontend ──
      # Rust is installed before the daemon cmake / make depends (above).

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # ── Windows: vcpkg + MSVC ──

      - name: vcpkg cache
        if: startsWith(matrix.platform, 'windows')
        uses: actions/cache@v6
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\installed
            C:\vcpkg\archives
          key: vcpkg-x64-windows-static-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-x64-windows-static-

      - name: Install Windows build dependencies
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg\archives,readwrite
        run: |
          vcpkg install --triplet x64-windows-static --overlay-ports="${{ github.workspace }}/../shekyl-core/vcpkg-overlay/ports" boost openssl libsodium libusb lmdb

      - name: Build Shekyl daemon sidecar (Windows / MSVC)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          cmake -S ..\shekyl-core -B ..\shekyl-core\build `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTATIC=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DBUILD_TESTS=OFF `
            -DSTACK_TRACE=OFF `
            -DUSE_DEVICE_TREZOR=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build ..\shekyl-core\build --config Release --target daemon --parallel 2

      - name: Place sidecar binary (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\binaries | Out-Null
          Copy-Item ..\shekyl-core\build\bin\Release\shekyld.exe `
                    src-tauri\binaries\shekyld-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        run: npm ci

      # ── Linux: build Tauri and upload artifacts manually ──

      - name: Build Tauri app (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: npx tauri build

      # Backend integration tests that need a live `shekyld` sidecar are
      # marked `#[ignore]`, so the fast CI job (ci.yml) skips them. They run
      # here on the release build, where the real sidecar was compiled from
      # shekyl-core and placed above and the frontend dist already exists
      # (from the tauri build), so the Tauri build script resolves.
      # `--lib --bins --tests` is required: a bare `cargo test -- --ignored`
      # also compiles rustdoc ` ```ignore ` examples (rustdoc treats
      # `--ignored` as "run ignored doctests"), which is how alpha.8's
      # Linux job died after the .deb had already been built.
      # Unit tests already ran on CI. Linux-only: daemon-interaction logic
      # is platform-agnostic, so one canonical run suffices. (No such test
      # exists yet — this is the standing runner, so an `#[ignore]` test
      # lands already wired to execute rather than silently running nowhere.)
      - name: Backend integration tests (sidecar, Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        working-directory: src-tauri
        run: cargo test --release --lib --bins --tests -- --ignored

      # Both runs fail here if a bundle is missing; only a tag push uploads.
      - name: Locate Linux bundles
        if: startsWith(matrix.platform, 'ubuntu')
        id: linux-bundles
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb artifact found after tauri build"
            exit 1
          fi
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No .AppImage artifact found after tauri build"
            exit 1
          fi
          RPM=$(find src-tauri/target/release/bundle/rpm -name '*.rpm' | head -1)
          if [ -z "$RPM" ]; then
            echo "::error::No .rpm artifact found after tauri build"
            exit 1
          fi
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "rpm=$RPM" >> "$GITHUB_OUTPUT"

      - name: Upload Linux bundles to release
        if: startsWith(matrix.platform, 'ubuntu') && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEB: ${{ steps.linux-bundles.outputs.deb }}
          APPIMAGE: ${{ steps.linux-bundles.outputs.appimage }}
          RPM: ${{ steps.linux-bundles.outputs.rpm }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" "$DEB" --clobber
          gh release upload "$TAG" "$APPIMAGE" --clobber
          gh release upload "$TAG" "$RPM" --clobber

      - name: Keep Linux bundles (dry run)
        if: startsWith(matrix.platform, 'ubuntu') && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DRY_RUN_ARTIFACT }}
          path: |
            ${{ steps.linux-bundles.outputs.deb }}
            ${{ steps.linux-bundles.outputs.appimage }}
            ${{ steps.linux-bundles.outputs.rpm }}
          if-no-files-found: error

      # ── macOS / Windows: tauri-action uploads to the release made above ──

      - name: Build and upload (macOS / Windows)
        if: ${{ !startsWith(matrix.platform, 'ubuntu') && github.event_name == 'push' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # With no releaseId, tagName or releaseName, tauri-action only builds.
      - name: Build (macOS / Windows, dry run)
        if: ${{ !startsWith(matrix.platform, 'ubuntu') && github.event_name != 'push' }}
        id: tauri-dry-run
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      # artifactPaths is a JSON array; upload-artifact takes one path per line.
      - name: List macOS / Windows bundles (dry run)
        if: ${{ !startsWith(matrix.platform, 'ubuntu') && github.event_name != 'push' }}
        id: tauri-bundles
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri-dry-run.outputs.artifactPaths }}
        run: |
          {
            echo 'paths<<BUNDLES'
            jq -r '.[]' <<<"$ARTIFACT_PATHS"
            echo 'BUNDLES'
          } >> "$GITHUB_OUTPUT"

      - name: Keep macOS / Windows bundles (dry run)
        if: ${{ !startsWith(matrix.platform, 'ubuntu') && github.event_name != 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DRY_RUN_ARTIFACT }}
          path: ${{ steps.tauri-bundles.outputs.paths }}
          if-no-files-found: error
