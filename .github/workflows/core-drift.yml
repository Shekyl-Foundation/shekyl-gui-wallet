# Does this wallet still build against shekyl-core?
#
# The Tauri crate path-depends on `../shekyl-core/rust/*`, so every core API
# change is a change to this repository's build — but core's CI does not
# build this wallet, and `ci.yml` only runs when *this* repo has a pull
# request. Between the two, core changes land and sit here undiscovered:
# on 2026-08-23 four separate ones had accumulated (a deleted
# `WalletFile::verify_password`, a `StakePosture` parameter, three new
# `FirstStakeError` variants, a new `StakingReadView` field), and the wallet
# had not compiled against core dev for some time.
#
# This job asks the question on a schedule, so drift surfaces within a day
# whether or not anyone opens a pull request here, and on demand for any
# core ref. `workflow_call` is the important entry point: it lets
# shekyl-core run this against a *branch*, turning "we broke the GUI" from a
# discovery into a failing check on the pull request that would do it.
#
# A caller that passes `core_ref` is obeyed. When this workflow runs in
# the wallet repository and `core_ref` is left at `dev`, a wallet branch
# whose name also exists on shekyl-core is the core under test — the
# same rule `ci.yml` uses. shekyl-core's `gui-drift.yml` is the other
# direction: it passes `wallet_ref` when this repository has a branch of
# the same name.
name: Core drift

on:
  pull_request:
    branches: [dev]
  schedule:
    # Daily, offset off the hour so it does not queue behind the fleet.
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      core_ref:
        description: "shekyl-core ref to build against"
        type: string
        default: dev
  workflow_call:
    inputs:
      core_repository:
        description: "owner/repo holding shekyl-core"
        type: string
        default: Shekyl-Foundation/shekyl-core
      core_ref:
        description: "shekyl-core ref to build against (a branch, tag, or SHA)"
        type: string
        default: dev
      wallet_ref:
        description: "ref of this wallet to build (defaults to dev)"
        type: string
        default: dev

concurrency:
  # The wallet side of the key keeps a core pull request on a feature
  # branch from cancelling the daily dev run, or another core pull request
  # that is still building wallet dev. A pull request of this repo is named
  # by its head repository and number: two forks can share a branch name,
  # and a fork branch named dev must not cancel that daily run.
  group: "core-drift-${{ inputs.core_ref || 'dev' }}-${{ github.event_name == 'pull_request' && format('{0}@{1}', github.event.pull_request.head.repo.full_name, github.event.pull_request.number) || inputs.wallet_ref || (github.event_name == 'schedule' && 'dev') || github.head_ref || github.ref_name }}"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-against-core:
    name: Wallet builds against shekyl-core
    runs-on: ubuntu-latest
    steps:
      # Explicit repository and path. Called across repositories, the
      # `github` context is the *caller's*, so a bare checkout here would
      # fetch shekyl-core into the workspace and there would be no wallet to
      # build. Naming both sides makes the layout the same however this
      # workflow is entered:
      #
      #   $GITHUB_WORKSPACE/gui/          this wallet (src-tauri inside)
      #   $GITHUB_WORKSPACE/shekyl-core/  the core under test
      #
      # which is what `../../shekyl-core/rust/*` in src-tauri/Cargo.toml
      # resolves to.
      - name: Checkout the wallet
        uses: actions/checkout@v5
        with:
          # A pull request checks out the head repository at the head
          # commit. `github.head_ref` is only a branch name, so checking
          # that name out of Shekyl-Foundation/shekyl-gui-wallet builds the
          # official branch (or fails) instead of a fork's commits.
          # workflow_call, schedule, and dispatch stay on the official
          # repository: a caller passes `wallet_ref`, and the schedule
          # forces `dev` (GitHub runs it from `main`, which is expected to
          # lag core `dev`).
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || 'Shekyl-Foundation/shekyl-gui-wallet' }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.wallet_ref || (github.event_name == 'schedule' && 'dev') || github.head_ref || github.ref_name }}
          path: gui

      - name: Checkout shekyl-core
        env:
          CORE_REPOSITORY: ${{ inputs.core_repository || 'Shekyl-Foundation/shekyl-core' }}
          CORE_REF: ${{ inputs.core_ref || 'dev' }}
          EVENT_NAME: ${{ github.event_name }}
          # Branch name, not the checkout SHA. `git ls-remote --heads`
          # matches a branch. A fork pull request still looks up shekyl-core
          # by that name; the wallet commits themselves were checked out
          # above at `head.sha`.
          WALLET_REF: ${{ inputs.wallet_ref || (github.event_name == 'schedule' && 'dev') || github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # A workflow_call caller named the core ref (shekyl-core passes
          # the pull-request merge ref). Do not replace it. Everywhere
          # else, a wallet feature branch that also exists on shekyl-core
          # is the core under test, matching ci.yml.
          if [ "$EVENT_NAME" != "workflow_call" ] && [ "$CORE_REF" = "dev" ]; then
            case "$WALLET_REF" in
              main|dev|"") ;;
              *)
                hits=$(git ls-remote --heads "https://github.com/${CORE_REPOSITORY}.git" "$WALLET_REF")
                if [ -n "$hits" ]; then
                  CORE_REF="$WALLET_REF"
                fi
                ;;
            esac
          fi
          echo "CORE_REF_RESOLVED=$CORE_REF" >> "$GITHUB_ENV"
          echo "Building against ${CORE_REPOSITORY}@${CORE_REF}"
          # Fetch the ref rather than `clone --branch`, which takes only a
          # branch or tag name — the input accepts a commit SHA too, and
          # naming a SHA is how you find which commit broke the wallet.
          mkdir shekyl-core
          git -C shekyl-core init --quiet
          git -C shekyl-core remote add origin "https://github.com/${CORE_REPOSITORY}.git"
          git -C shekyl-core fetch --depth 1 --quiet origin "$CORE_REF"
          git -C shekyl-core checkout --quiet FETCH_HEAD
          git -C shekyl-core submodule update --init --recursive --depth 1 --quiet
          echo "CORE_SHA=$(git -C shekyl-core rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./gui/src-tauri -> target

      # The Tauri build script resolves `externalBin` before compiling
      # anything, and fails the build if the sidecar path is absent — so a
      # check that never runs the daemon still needs a file at its name.
      # Empty is enough: nothing executes it here, and a real `shekyld`
      # would only make the job slower and its result dependent on a build
      # we are not testing.
      #
      # `ci.yml` and `codeql.yml` carry this `run:` block verbatim — three
      # copies of a snippet that derives its own value, so they cannot
      # disagree about a constant. Lift it into a composite action when a
      # fourth copy appears or it needs to branch (a Windows check job would
      # need the `.exe` suffix); today a local `uses:` would have to be
      # spelled differently here anyway, since this workflow checks the
      # wallet out under `gui/` rather than at the workspace root.
      - name: Create sidecar placeholder for Tauri build script
        working-directory: gui
        run: |
          set -euo pipefail
          # Tauri names the sidecar by target triple (see
          # src-tauri/binaries/README.md). Read it from the toolchain rather
          # than hard-coding one, so the step is correct on whatever runner
          # this job lands on.
          triple=$(rustc -vV | sed -n 's/^host: //p')
          [ -n "$triple" ] || { echo "no 'host:' line in 'rustc -vV'" >&2; exit 1; }
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/shekyld-$triple"

      # No `npm ci` / `npm run build`: the frontend bundle is a bundle-time
      # resource, and `cargo check` completes without `dist/` (verified).
      # This job asks one question — does the wallet still compile against
      # this core — and every step that does not serve it is time paid on
      # every core pull request.
      #
      # `--all-targets`, deliberately: the break that started this job was in
      # test code (a `StakingReadView` initialiser), which `ci.yml`'s
      # `cargo clippy` — no `--all-targets` — compiles right past.
      - name: cargo check against core
        working-directory: ./gui/src-tauri
        run: cargo check --all-targets

      # The command surface reads the wallet contract from the core checkout
      # above (`../shekyl-core` resolves from `gui/`). A core PR that REJECTs
      # a method the GUI registers, or drops a method a RENAME/COMPOSITE row
      # cites, goes red here — on the core pull request, through
      # `workflow_call` — not on the next GUI PR. Grep-cheap: no npm, no
      # cargo. Policy: .cursor/rules/28-command-surface.mdc
      - name: Command surface against the core contract
        working-directory: gui
        run: scripts/ci/check_command_surface.sh

      - name: Report
        if: always()
        run: |
          {
            echo "### Core drift"
            echo
            echo "- core: \`${{ inputs.core_repository || 'Shekyl-Foundation/shekyl-core' }}@${CORE_REF_RESOLVED:-unknown}\` (\`${CORE_SHA:-unknown}\`)"
            echo "- wallet: \`${{ inputs.wallet_ref || (github.event_name == 'schedule' && 'dev') || github.head_ref || github.ref_name }}\`"
            echo "- result: **${{ job.status }}**"
            echo
            echo "A failure here means a shekyl-core change and this wallet disagree."
            echo "Fix it in the pull request that caused it, not later."
          } >> "$GITHUB_STEP_SUMMARY"
