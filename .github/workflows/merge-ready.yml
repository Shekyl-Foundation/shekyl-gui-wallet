#
# The `merge-ready` commit status: the owning lane's "done", enforced
# (ruled 2026-11-19). It is a signal to the merger, not a second test run
# (ruled 2026-11-23). There is one judge for both repositories:
# shekyl-core's scripts/ci/merge_ready.py, which has the whole contract.
#
# The owning lane applies the `merge-ready` label when review and validation
# are complete: every check on the current head has concluded (not only the
# required ones), its fleet and local runs for that head are done, and its
# review threads are resolved.
# This workflow keeps the `merge-ready` status, the required check, true to
# it:
#   - without the label the status is pending (`waiting`), never red and
#     never skipped;
#   - a push takes the label off, so a label never vouches for a head it did
#     not see;
#   - the label going on is checked against every check run and status on
#     the head; a check still running or red, an open review thread or a
#     draft takes it off again, with a comment naming each.
#
# The status, not the job, is the required check: a skipped job counts as
# a pass to protection, and a head with no status at all is blocked as
# "expected". So the job's `if` may skip an event that changes nothing: a
# label other than `merge-ready` going on or off. Skipped, that event never
# enters the job's concurrency group, so it cannot cancel a push's run
# before the push's run takes the label off. `pull_request`, not
# `pull_request_target`: the latter takes its workflow from the default
# branch, which is `main`. A fork's run holds no write token and posts
# nothing, so a fork's pull request stays blocked; this repository has
# none. Runs per event: seconds (API calls), up to SETTLE_SECONDS more
# when the labelling itself started a check.

name: ci/merge-ready

on:
  # Every event that changes the head, the draft state or the labels. No
  # base filter: a pull request on any base keeps its status.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

jobs:
  # Not named `merge-ready`: a ruleset's required check matches a check run
  # and a commit status by name alike, and this job always ends green.
  label-check:
    name: merge-ready label check
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'merge-ready'
    # The newest event decides: an older evaluation of the same pull request
    # is cancelled, and the newer one posts. On the job, not the workflow: a
    # workflow-level group is entered before the `if` is read, so a skipped
    # event would still cancel the run it should leave alone.
    concurrency:
      group: merge-ready-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5  # API calls, and at most SETTLE_SECONDS of waiting
    permissions:
      # actions: the head's workflow runs, so a run a newer one replaced is
      # not judged, and a review bot's run is known by its path.
      actions: read
      # checks: the head's check runs, and the annotation that says a newer
      # run of a concurrency group replaced one.
      checks: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # The script alone, from shekyl-core's `dev` as it is now: one judge
      # for both repositories, never a pull request's own copy. Public, so
      # the checkout needs no token.
      - uses: actions/checkout@v5
        with:
          repository: Shekyl-Foundation/shekyl-core
          ref: dev
          sparse-checkout: scripts/ci/merge_ready.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'merge-ready') }}
          # The label event's time: a check that was already running then
          # refuses the label at once, without the settle wait.
          LABELLED_AT: ${{ github.event.pull_request.updated_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/merge_ready.py run
