[package]
name = "shekyl-wallet"
version = "3.1.0-alpha.5"
description = "Shekyl desktop wallet"
authors = ["The Shekyl Foundation"]
license = "BSD-3-Clause"
repository = "https://github.com/Shekyl-Foundation/shekyl-gui-wallet"
edition = "2021"

[lib]
name = "shekyl_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
dirs = "6"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
shekyl-shard-visual = { path = "../../shekyl-core/rust/shekyl-shard-visual" }
shekyl-shard-source = { path = "../../shekyl-core/rust/shekyl-shard-source" }
shekyl-scanner = { path = "../../shekyl-core/rust/shekyl-scanner" }
shekyl-rpc-client = { path = "../../shekyl-core/rust/shekyl-rpc-client" }
shekyl-rpc-transport = { path = "../../shekyl-core/rust/shekyl-rpc-transport" }
shekyl-engine-core = { path = "../../shekyl-core/rust/shekyl-engine-core" }
shekyl-engine-file = { path = "../../shekyl-core/rust/shekyl-engine-file" }
shekyl-engine-prefs = { path = "../../shekyl-core/rust/shekyl-engine-prefs" }
shekyl-engine-state = { path = "../../shekyl-core/rust/shekyl-engine-state" }
shekyl-wire = { path = "../../shekyl-core/rust/shekyl-wire" }
shekyl-crypto-pq = { path = "../../shekyl-core/rust/shekyl-crypto-pq" }
shekyl-address = { path = "../../shekyl-core/rust/shekyl-address" }
shekyl-units = { path = "../../shekyl-core/rust/shekyl-units" }
curve25519-dalek = { version = "4", features = ["zeroize"] }
tokio-util = "0.7"
tracing = "0.1"
thiserror = "1"
zeroize = { version = "1", features = ["alloc"] }
rand = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
# Test-only: constructing core StakingReadView / StakedOutput fixtures needs
# the shekyl-types newtypes (already transitive via shekyl-engine-core).
shekyl-types = { path = "../../shekyl-core/rust/shekyl-types" }
